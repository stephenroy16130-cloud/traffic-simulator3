<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Light Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Traffic Light Simulator</h1>
            <p class="subtitle">Random · Console · Visual</p>
        </header>

        <div class="traffic-light">
            <div class="light red" id="redLight">
                <div class="light-inner">
                    <svg class="icon" viewBox="0 0 48 48">
                        <rect x="6" y="18" width="36" height="13" rx="5" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M13 18 L16 9 L32 9 L35 18 Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                        <rect x="17" y="11" width="6" height="6" rx="1.5" fill="#1a1a1a" opacity="0.7"/>
                        <rect x="25" y="11" width="6" height="6" rx="1.5" fill="#1a1a1a" opacity="0.7"/>
                        <circle cx="14" cy="33" r="5" fill="none" stroke="currentColor" stroke-width="3"/>
                        <circle cx="34" cy="33" r="5" fill="none" stroke="currentColor" stroke-width="3"/>
                        <circle cx="14" cy="33" r="2" fill="currentColor"/>
                        <circle cx="34" cy="33" r="2" fill="currentColor"/>
                    </svg>
                </div>
            </div>
            <div class="light yellow" id="yellowLight">
                <div class="light-inner">
                    <svg class="icon" viewBox="0 0 48 48">
                        <polygon points="24,5 6,40 42,40" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round"/>
                        <rect x="22" y="16" width="4" height="12" rx="2" fill="currentColor"/>
                        <circle cx="24" cy="34" r="2.5" fill="currentColor"/>
                    </svg>
                </div>
            </div>
            <div class="light green" id="greenLight">
                <div class="light-inner">
                    <svg class="icon" viewBox="0 0 48 48">
                        <circle cx="24" cy="8" r="5" fill="currentColor" stroke="currentColor" stroke-width="1.2"/>
                        <line x1="24" y1="13" x2="24" y2="28" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
                        <line x1="24" y1="18" x2="15" y2="24" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                        <line x1="24" y1="18" x2="33" y2="21" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                        <line x1="24" y1="28" x2="16" y2="39" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
                        <line x1="24" y1="28" x2="32" y2="37" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
                        <line x1="36" y1="14" x2="40" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                    </svg>
                </div>
            </div>
        </div>

        <button id="simulateBtn">SIMULATE</button>
        <p class="console-hint">Check the console (F12) for the full output.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
